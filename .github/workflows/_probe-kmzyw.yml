name: 探测康美中药网海外可达性

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: 测连通性
        run: |
          echo "== 1. 列表页 =="
          curl -sS -o /dev/null -w "http=%{http_code} time=%{time_total}s size=%{size_download}\n" \
            --max-time 30 "https://www.kmzyw.com.cn/jiage/today_price.html" || echo "列表页失败 rc=$?"
          echo "== 2. 历史接口(POST) =="
          curl -sS -o /tmp/h.txt -w "http=%{http_code} time=%{time_total}s size=%{size_download}\n" \
            --max-time 30 -X POST \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -H "X-Requested-With: XMLHttpRequest" \
            -A "Mozilla/5.0" \
            --data "name=%E5%85%AB%E8%A7%92%E8%8C%B4%E9%A6%99&standard=%E7%BB%9F&origin=%E5%B9%BF%E8%A5%BF&site=%E4%BA%B3%E5%B7%9E" \
            "https://www.kmzyw.com.cn/jiage/resouces/jsp/price_history_todaylist.jsp" || echo "历史接口失败 rc=$?"
          echo "== 返回前 300 字 =="
          head -c 300 /tmp/h.txt || true
          echo
          echo "== 3. 第 3 页 =="
          curl -sS -o /tmp/p3.html -w "http=%{http_code} time=%{time_total}s size=%{size_download}\n" \
            --max-time 30 "https://www.kmzyw.com.cn/jiage/today_price.html?pageNum=3" || echo "第3页失败 rc=$?"
          grep -c "km-table" /tmp/p3.html || true
