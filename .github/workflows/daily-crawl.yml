name: 每日药材价格抓取

on:
  # 每天 3 个时间点（cron 用 UTC，= 北京时间 - 8 小时）：
  #   UTC 00:17 → 北京 08:17（主时间）
  #   UTC 03:17 → 北京 11:17（兜底）
  #   UTC 06:17 → 北京 14:17（兜底）
  # 为什么要设 3 次：GitHub 官方文档明确说明，定时任务在高负载时会被「延迟」，
  # 负载足够高时「部分排队的任务会被直接丢弃」——单点触发不可靠。
  # 后两次是补跑机会，如果今天已经成功抓过会自动跳过（见第一步）。
  # 三个时间点都要避开整点，整点是 GitHub 负载最高的时候。
  schedule:
    - cron: '17 0,3,6 * * *'
  # 也允许在 GitHub 网页上手动点一下就跑，方便随时测试
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 90      # 正常约 16~20 分钟，留足余量

    steps:
      # 兜底机制的前提：同一天只真正抓一次。
      # 如果今天已经有成功的运行，本次直接跳过（跳过时整个任务约 10 秒，几乎不耗额度）。
      - name: 检查今天是否已经抓过
        id: chk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(date -u +%F)
          URL="https://api.github.com/repos/${{ github.repository }}/actions/workflows/daily-crawl.yml/runs?status=success&created=$TODAY&per_page=1"
          JSON=$(curl -s --max-time 30 -H "Authorization: Bearer $GH_TOKEN" "$URL" || echo '{}')
          N=$(echo "$JSON" | python3 -c "import sys,json;print(json.load(sys.stdin).get('total_count',0))" 2>/dev/null)
          # 查询失败 / 权限不足时按「今天没跑过」处理：宁可多跑一次，也不能漏跑
          case "$N" in ''|*[!0-9]*) N=0 ;; esac
          echo "今天（UTC $TODAY）已成功的运行数 = $N"
          if [ "$N" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "今天已经成功抓取过，本次跳过（这是兜底触发，属正常现象）"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "今天还没抓过，开始执行"
          fi

      - name: 拉取代码
        if: steps.chk.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: 准备 Python
        if: steps.chk.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        if: steps.chk.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: 还原 Google 服务账号密钥
        if: steps.chk.outputs.skip != 'true'
        env:
          GSHEET_SA_B64: ${{ secrets.GSHEET_SA_B64 }}
        run: |
          if [ -z "$GSHEET_SA_B64" ]; then
            echo "::error::未配置 GSHEET_SA_B64 密钥，无法推送 Google Sheet"
            exit 1
          fi
          echo "$GSHEET_SA_B64" | base64 -d > service_account.json

      - name: 抓取数据并推送
        if: steps.chk.outputs.skip != 'true'
        env:
          SERVICE_ACCOUNT_FILE: ${{ github.workspace }}/service_account.json
          TZ: Asia/Shanghai
        run: python fast_crawl.py --alias

      - name: 结果自检
        if: steps.chk.outputs.skip != 'true'
        run: |
          lines=$(wc -l < 药材涨落对比结果.csv)
          echo "CSV 行数（含表头）：$lines"
          if [ "$lines" -lt 100 ]; then
            echo "::error::结果异常少（$lines 行），大概率被站点拦截了"
            exit 1
          fi

      # 抓取脚本在推送失败时只打一行日志、不会让任务失败。
      # 没有这一步，推送失败时任务照样显示绿色，表格不更新你也不会收到通知。
      - name: 校验 Google Sheet 推送结果
        if: steps.chk.outputs.skip != 'true'
        run: |
          if grep -q "推送成功" crawl.log; then
            echo "Google Sheet 推送成功"
          else
            echo "::error::Google Sheet 推送失败，请看下方日志尾部"
            tail -n 20 crawl.log
            exit 1
          fi

      - name: 保存结果文件
        if: always() && steps.chk.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: 药材数据-${{ github.run_number }}
          retention-days: 30
          path: |
            药材涨落对比结果.csv
            crawl.log
            failed_medicines.txt
