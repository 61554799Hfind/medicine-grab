name: 每日康美药材价格

# 数据从哪来
#   康美价格行情在 www.kmzyw.com.cn 上，这个域名和康美供求那个 kmb2b.com 一样对境外不通，
#   海外 runner 三个请求全部 30 秒超时（2026-11-17 实测）。所以抓取跑在阿里云函数上，
#   函数每早把 km_spice_price.csv / km_spice_hist.json.gz 提交回仓库，这里只负责推 Google 表格。
#   收录口径 = medicine_list.txt（药通网 971 味）对照康美报价，991 行 / 589 个品名。
#
# 什么时候跑
#   挂在「每日供应商抓取」跑完之后（那个由 Cloudflare 每早 08:05 准点 dispatch）。
#   阿里云函数 07:30 就抓完提交了，08:05 起推表时数据已经是当天的。
#   这样做的好处：不用再往 Cloudflare 加第 4 条 cron，也不用改 Worker 代码。

on:
  workflow_run:
    workflows: ["每日供应商抓取"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: medicine-spice-push
  cancel-in-progress: false

jobs:
  spice:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      PYTHONUNBUFFERED: '1'

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 检查密钥与表格 ID
        env:
          GSHEET_SA_B64: ${{ secrets.GSHEET_SA_B64 }}
          SHEET_ID_SPICE: ${{ secrets.SHEET_ID_SPICE }}
        run: |
          if [ -z "$GSHEET_SA_B64" ]; then
            echo "::error::缺少 Secret GSHEET_SA_B64（Google 服务账号密钥），无法写表"
            exit 1
          fi
          if [ -z "$SHEET_ID_SPICE" ]; then
            echo "::error::缺少 Secret SHEET_ID_SPICE。去 Settings → Secrets and variables → Actions → New repository secret，名称 SHEET_ID_SPICE，值填香料价格表 ID（地址栏 /spreadsheets/d/<这串>/edit 中间那串）"
            exit 1
          fi
          echo "密钥与表格 ID 均已配置"

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install gspread google-auth

      - name: 还原 Google 服务账号密钥
        env:
          GSHEET_SA_B64: ${{ secrets.GSHEET_SA_B64 }}
        run: |
          RAW="$GSHEET_SA_B64"
          STRIP=$(printf '%s' "$RAW" | tr -d '[:space:]')
          if [ "${STRIP:0:1}" = "{" ]; then
            printf '%s' "$RAW" > service_account.json
          else
            if ! printf '%s' "$STRIP" | base64 -d > service_account.json 2>/dev/null; then
              echo "::error::GSHEET_SA_B64 既不是 JSON 也不是合法 base64"
              exit 1
            fi
          fi
          python -c "import json;d=json.load(open('service_account.json',encoding='utf-8'));assert d.get('type')=='service_account';print('密钥校验通过:',d.get('client_email'))"

      - name: 检查数据新鲜度
        env:
          TZ: Asia/Shanghai
        run: |
          python - <<'PY'
          import csv, gzip, json, os, sys
          from datetime import date
          ok = True
          if not os.path.exists("km_spice_price.csv"):
              print("::error::仓库里没有 km_spice_price.csv —— 阿里云价格函数没提交成功")
              sys.exit(1)
          rows = list(csv.DictReader(open("km_spice_price.csv", encoding="utf-8-sig")))
          def stamp(r):
              return (r.get("更新时间") or r.get("更新日期") or "")[:10]
          days = sorted({stamp(r) for r in rows})
          print(f"明细 {len(rows)} 行，更新时间 {days}")
          if len(rows) < 900:
              print(f"::error::只有 {len(rows)} 行，明显不对（按 medicine_list 对照正常 990 行左右）"
                    f"—— 阿里云函数可能还是「只收香料」的旧版（v5 及以前），需要重新部署 km_spice.zip")
              ok = False
          if days and days[-1] != date.today().isoformat():
              print(f"::warning title=数据不是今天::最新是 {days[-1]}，"
                    f"今天 {date.today()} —— 阿里云函数可能没跑成功，表里会沿用上一份")
          if not os.path.exists("km_spice_hist.json.gz"):
              print("::warning title=缺月价格数据::没有 km_spice_hist.json.gz，走势页和「历史价格」链接会跳过")
          else:
              with gzip.open("km_spice_hist.json.gz", "rt", encoding="utf-8") as f:
                  h = json.load(f)
              nm = sum(1 for v in h.values() if v.get("monthly"))
              print(f"月价格 {len(h)} 味，其中有数据 {nm} 味")
              if nm < len(h) * 0.8:
                  print(f"::warning title=月价格偏少::只有 {nm}/{len(h)} 味有月价格")
          sys.exit(0 if ok else 1)
          PY

      - name: 推送 Google 表格
        env:
          TZ: Asia/Shanghai
          SHEET_ID_SPICE: ${{ secrets.SHEET_ID_SPICE }}
        run: |
          python km_spice_push.py || {
            echo "::error title=表格没共享给服务账号::在 Google 表格右上角点「共享」，把 medicine-data@crawler-510215.iam.gserviceaccount.com 加成「编辑者」，然后重跑这个 workflow"
            exit 1
          }

      - name: 结果自检
        env:
          SHEET_ID_SPICE: ${{ secrets.SHEET_ID_SPICE }}
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import csv, gzip, json, os
          print("\n### 康美药材价格（对照 medicine_list.txt）\n")
          rows = []
          if os.path.exists("km_spice_price.csv"):
              rows = list(csv.DictReader(open("km_spice_price.csv", encoding="utf-8-sig")))
              up = sum(1 for r in rows if r.get("走势") == "涨")
              down = sum(1 for r in rows if r.get("走势") == "跌")
              names = len({r.get("品名") for r in rows})
              print("| 项目 | 数量 |")
              print("|---|---|")
              print(f"| 明细 | {len(rows)} 行 / {names} 个品名 |")
              print(f"| 本周上涨 | {up} 行 |")
              print(f"| 本周下跌 | {down} 行 |")
              d = (rows[0].get("更新时间") or rows[0].get("更新日期") or "?") if rows else "-"
              print(f"| 数据时间 | {d} |")
          if os.path.exists("km_spice_hist.json.gz"):
              with gzip.open("km_spice_hist.json.gz", "rt", encoding="utf-8") as f:
                  h = json.load(f)
              print(f"| 有月价格 | {sum(1 for v in h.values() if v.get('monthly'))} 味 |")
          print()
          print("工作表：药材价格（第一页）/ 药材走势1…N（每页 80 味，月价格图 + 历史月均价）")
          PY

      - name: 回读表格结构（留证据）
        env:
          SHEET_ID_SPICE: ${{ secrets.SHEET_ID_SPICE }}
        run: |
          python - <<'PY'
          import json, os
          import gspread
          sh = gspread.service_account(filename="service_account.json").open_by_key(
              os.environ["SHEET_ID_SPICE"])
          meta = sh.fetch_sheet_metadata(
              {"fields": "sheets(properties(sheetId,title,index),charts(chartId))"})
          sheets = []
          for s in meta.get("sheets", []):
              p = s.get("properties", {})
              sheets.append({"title": p.get("title"), "index": p.get("index"),
                             "charts": len(s.get("charts") or [])})
          out = {"sheets": sorted(sheets, key=lambda x: x["index"] or 0)}
          price = sh.worksheet("药材价格")
          out["price_head"] = price.get_values("A1:T3")[:3]
          out["price_rows"] = price.row_count
          tr = sh.worksheet("药材走势1")
          out["trend_cols"] = tr.col_count
          out["trend_title"] = tr.get_values("A2:I2")
          out["trend_block1"] = tr.get_values("A20:M26")   # 表标题 + 年/月表头 + 数据行
          json.dump(out, open("sheet_check.json", "w", encoding="utf-8"),
                    ensure_ascii=False, indent=1)
          print("工作表顺序:", [s["title"] for s in out["sheets"]])
          print("各页图表数:", [(s["title"], s["charts"]) for s in out["sheets"]])
          PY

      - name: 保存结果文件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 康美香料-${{ github.run_number }}
          retention-days: 14
          path: |
            km_spice_price.csv
            km_spice_hist.json.gz
            sheet_check.json
