name: 每日中香网香料价格

# 数据从哪来
#   中香网「香料行情」https://www.zhongxiangwang.cn/latest-price
#   接口 /api/front/skuChangePrice/getSkuPriceExcelList（AES+RSA 加密，和求购线同一套）
#   全站 135 行 = 国内 50 品类/120 行 + 国外 4 品类/15 行，粒度是「品类 + 产地 + 规格」。
#   收录口径对标 medicine_list.txt（971 味）：逐字命中 + 同物异名/规格变体映射，
#   明细表加「清单名」列标出对应关系；中香网清单内 131 行 / 41 味，清单外 4 品类照留。
#   中香网对境外开放（求购线一直在 runner 上抓），所以这条线不需要阿里云，直接在 runner 上抓。
#
# 什么时候跑
#   挂在「每日康美药材价格」跑完之后（那条 08:15 起、约 1 小时），
#   避开上午几条线的 Google 写入配额；当天报价日仍是当天。
#   schedule 只是兜底（本仓库 cron 长期迟到 5~8 小时，准点靠 Cloudflare 的 dispatch）。

on:
  workflow_run:
    workflows: ["每日康美药材价格"]
    types: [completed]
  workflow_dispatch:
  # 兜底：北京 09:50，等康美价格（08:15~09:15）和药通网价格（08:45~09:45）都跑完，
  # 避免三个 workflow 共用一个服务账号撞「60 次写入/分钟」配额
  schedule:
    - cron: '50 1 * * *'

permissions:
  contents: write

concurrency:
  group: medicine-zx-price
  cancel-in-progress: false

jobs:
  zx:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 上游「每日康美药材价格」失败时不必跟着跑（中香网本身对境外开放，跑也能跑，
    # 但那天表格写入会挤在一起，跳过更稳；要补跑就手动 dispatch）
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'

    env:
      PYTHONUNBUFFERED: '1'

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 检查密钥与表格 ID
        env:
          GSHEET_SA_B64: ${{ secrets.GSHEET_SA_B64 }}
          SHEET_ID_ZXPRICE: ${{ secrets.SHEET_ID_ZXPRICE }}
        run: |
          if [ -z "$GSHEET_SA_B64" ]; then
            echo "::error::缺少 Secret GSHEET_SA_B64（Google 服务账号密钥），无法写表"
            exit 1
          fi
          if [ -z "$SHEET_ID_ZXPRICE" ]; then
            echo "::error::缺少 Secret SHEET_ID_ZXPRICE。去 Settings → Secrets and variables → Actions → New repository secret，名称 SHEET_ID_ZXPRICE，值填中香网价格表 ID（地址栏 /spreadsheets/d/<这串>/edit 中间那串）"
            exit 1
          fi
          echo "密钥与表格 ID 均已配置"

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install gspread google-auth requests cryptography

      - name: 还原 Google 服务账号密钥
        env:
          GSHEET_SA_B64: ${{ secrets.GSHEET_SA_B64 }}
        run: |
          RAW="$GSHEET_SA_B64"
          STRIP=$(printf '%s' "$RAW" | tr -d '[:space:]')
          if [ "${STRIP:0:1}" = "{" ]; then
            printf '%s' "$RAW" > service_account.json
          else
            if ! printf '%s' "$STRIP" | base64 -d > service_account.json 2>/dev/null; then
              echo "::error::GSHEET_SA_B64 既不是 JSON 也不是合法 base64"
              exit 1
            fi
          fi
          python -c "import json;d=json.load(open('service_account.json',encoding='utf-8'));assert d.get('type')=='service_account';print('密钥校验通过:',d.get('client_email'))"

      - name: 抓取中香网价格
        env:
          TZ: Asia/Shanghai
        run: |
          python zx_price.py || {
            echo "::error title=中香网抓取失败::看上面日志。CSV 没被写成空的，表里会沿用上一份数据"
            exit 1
          }

      - name: 提交数据回仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zx_price.csv zx_price_hist.json.gz
          if git diff --staged --quiet; then
            echo "数据无变化，无需提交"
          else
            git commit -m "chore: 中香网香料价格 $(TZ=Asia/Shanghai date +%F)"
            git push
          fi

      - name: 推送 Google 表格
        env:
          TZ: Asia/Shanghai
          SHEET_ID_ZXPRICE: ${{ secrets.SHEET_ID_ZXPRICE }}
        run: |
          python zx_price_push.py || {
            echo "::error title=表格没共享给服务账号::在 Google 表格右上角点「共享」，把 medicine-data@crawler-510215.iam.gserviceaccount.com 加成「编辑者」，然后重跑这个 workflow"
            exit 1
          }

      - name: 回读表格结构（留证据）
        env:
          SHEET_ID_ZXPRICE: ${{ secrets.SHEET_ID_ZXPRICE }}
        run: |
          python - <<'PY'
          import json, os
          import gspread
          sh = gspread.service_account(filename="service_account.json").open_by_key(
              os.environ["SHEET_ID_ZXPRICE"])
          meta = sh.fetch_sheet_metadata(
              {"fields": "sheets(properties(sheetId,title,index,hidden),charts(chartId))"})
          sheets = []
          for s in meta.get("sheets", []):
              p = s.get("properties", {})
              sheets.append({"title": p.get("title"), "index": p.get("index"),
                             "hidden": bool(p.get("hidden")),
                             "charts": len(s.get("charts") or [])})
          sheets.sort(key=lambda x: x["index"] or 0)
          out = {"sheets": sheets}
          cn = sh.worksheet("国内香料价格")
          out["price_head"] = cn.get_values("A1:M3")
          out["cn_rows"] = len(cn.get_all_values()) - 1
          try:
              xx = sh.worksheet("国外香料价格")
              out["xx_rows"] = len(xx.get_all_values()) - 1
          except Exception:
              out["xx_rows"] = -1
          tr = sh.worksheet("国内香料走势1")
          out["trend_title"] = tr.get_values("A2:D2")
          out["trend_matrix"] = tr.get_values("A20:M22")
          json.dump(out, open("sheet_check.json", "w", encoding="utf-8"),
                    ensure_ascii=False, indent=1)
          print("工作表顺序:", [(s["title"], s["charts"]) for s in sheets])
          print("国内明细行数:", out["cn_rows"], "／ 国外明细行数:", out["xx_rows"])
          print("表头:", out["price_head"][0])
          print("第一块:", out["trend_title"], out["trend_matrix"][:2])
          PY

      - name: 保存结果文件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 中香网香料价格-${{ github.run_number }}
          retention-days: 14
          path: |
            zx_price.csv
            zx_price_hist.json.gz
            sheet_check.json
