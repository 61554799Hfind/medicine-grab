name: 每日供应商抓取

on:
  # 北京时间 08:05（cron 用 UTC，= 北京时间 - 8 小时 → UTC 00:05）。
  # GitHub 的定时任务普遍会延迟 5~15 分钟才真正起来，所以往前留了余量，
  # 实际落点通常在 08:10~08:20，抓取 3 分钟 + 推送 30 秒，八点半前表格就是新的。
  # 和主业 08:17 那一轮可能并行：两边是不同 runner、不同出口 IP，
  # 药通网限流是按 IP 的滑动窗口，互不影响。
  schedule:
    - cron: '5 0 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: '只抓前 N 味（测试用，留空=全量）'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: medicine-supplier-crawl
  cancel-in-progress: false

jobs:
  supplier:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      PYTHONUNBUFFERED: '1'

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 检查密钥与表格 ID
        id: cfg
        env:
          GSHEET_SA_B64: ${{ secrets.GSHEET_SA_B64 }}
          SHEET_ID_SUPPLIER: ${{ secrets.SHEET_ID_SUPPLIER }}
        run: |
          [ -n "$GSHEET_SA_B64" ] && echo "sa=true" >> "$GITHUB_OUTPUT" || echo "sa=false" >> "$GITHUB_OUTPUT"
          [ -n "$SHEET_ID_SUPPLIER" ] && echo "sid=true" >> "$GITHUB_OUTPUT" || echo "sid=false" >> "$GITHUB_OUTPUT"
          if [ -z "$GSHEET_SA_B64" ]; then
            echo "::error::缺少 Secret GSHEET_SA_B64（Google 服务账号密钥），无法写表"
            exit 1
          fi
          if [ -z "$SHEET_ID_SUPPLIER" ]; then
            echo "::error::缺少 Secret SHEET_ID_SUPPLIER。去 Settings → Secrets and variables → Actions → New repository secret，名称 SHEET_ID_SUPPLIER，值填供应商表格 ID（地址栏 /spreadsheets/d/<这串>/edit 中间那串）"
            exit 1
          fi
          echo "密钥与表格 ID 均已配置"

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests gspread google-auth cryptography

      - name: 还原 Google 服务账号密钥
        env:
          GSHEET_SA_B64: ${{ secrets.GSHEET_SA_B64 }}
        run: |
          RAW="$GSHEET_SA_B64"
          STRIP=$(printf '%s' "$RAW" | tr -d '[:space:]')
          if [ "${STRIP:0:1}" = "{" ]; then
            printf '%s' "$RAW" > service_account.json
          else
            if ! printf '%s' "$STRIP" | base64 -d > service_account.json 2>/dev/null; then
              echo "::error::GSHEET_SA_B64 既不是 JSON 也不是合法 base64（长度 ${#STRIP}，开头 ${STRIP:0:16}）"
              exit 1
            fi
          fi
          python -c "import json;d=json.load(open('service_account.json',encoding='utf-8'));assert d.get('type')=='service_account';assert 'private_key' in d;print('密钥校验通过:',d.get('client_email'),'| key_id =',d.get('private_key_id'))"

      - name: 抓取药通网供货信息
        env:
          TZ: Asia/Shanghai
          LIMIT: ${{ github.event.inputs.limit }}
        run: |
          if [ -n "$LIMIT" ]; then
            python supplier_crawl.py --limit "$LIMIT"
          else
            python supplier_crawl.py
          fi

      # 康美在海外 runner 上连不通（443 直接丢包），所以康美那份 CSV 由阿里云函数
      # 每天 07:40 抓好提交回仓库，这一步只用仓库里的 supplier_km.csv，不重抓。
      - name: 抓取中香网供货信息
        env:
          TZ: Asia/Shanghai
        run: |
          python supplier_extra_crawl.py --only zx || {
            echo "::warning title=中香网抓取失败::供货数据保留仓库里上一份"
          }

      - name: 推送 Google 表格（三站全量覆盖）
        env:
          TZ: Asia/Shanghai
          SHEET_ID_SUPPLIER: ${{ secrets.SHEET_ID_SUPPLIER }}
        run: python supplier_multi_push.py

      - name: 结果自检
        run: |
          lines=$(wc -l < supplier_data.csv)
          echo "药通网 supplier_data.csv 行数（含表头）：$lines"
          if [ "$lines" -lt 50 ]; then
            echo "::error::结果异常少（$lines 行），大概率被站点拦截"
            exit 1
          fi
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import csv, os
          print("\n### 供应商各站数据\n")
          print("| 工作表 | 行数 | 更新日期 |")
          print("|---|---|---|")
          for tab, fn in (("药通网", "supplier_data.csv"),
                          ("康美", "supplier_km.csv"),
                          ("中香", "supplier_zx.csv")):
              if not os.path.exists(fn):
                  print(f"| {tab} | 跳过（文件缺失，表里保留上一份） | - |")
                  continue
              with open(fn, encoding="utf-8-sig") as f:
                  rows = list(csv.DictReader(f))
              d = rows[0].get("更新时间", "?") if rows else "-"
              print(f"| {tab} | {len(rows)} | {d} |")
          print()
          print("康美那份由阿里云函数每早 07:40 抓取提交；日期不是今天说明函数没跑成功。")
          PY

      - name: 保存结果文件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 供应商数据-${{ github.run_number }}
          retention-days: 14
          path: |
            supplier_data.csv
            supplier_km.csv
            supplier_zx.csv
            supplier_failed.txt
