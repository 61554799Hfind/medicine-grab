name: 每日药材价格抓取

on:
  # 每天北京时间 08:17 跑一次（cron 用 UTC，= 北京时间 - 8 小时 → UTC 00:17）。
  # 错开整点：整点是 GitHub 负载最高的时候，容易延迟或被丢弃。
  schedule:
    - cron: '17 0 * * *'
  # ⚠️ 注意：仓库连续 60 天没有任何提交，GitHub 会自动停用定时任务（cron 静默不跑）。
  # 备份方案：Cloudflare Workers（medicine-trigger）定时打 workflow_dispatch，见 cloudflare-worker-trigger.js。
  # 另：公开仓库的 Actions 分钟数免费不限量；私有仓库 Free 计划只有 2000 分钟/月。
  # 也允许在 GitHub 网页上手动点一下就跑，方便随时测试
  workflow_dispatch:

# GITHUB_TOKEN 默认权限是受限只读（只有 contents/metadata/packages: read），
# 访问 actions 相关接口必须显式申请。
permissions:
  contents: read
  actions: read

# ⚠️ 同一时间只允许一个抓取任务。注意这个 group 名不要和 job 上的名称撞车，
# 否则 GitHub 会报 "a deadlock was detected for concurrency group" 直接取消运行。
# 现在只保留这一处 concurrency 定义。
concurrency:
  group: medicine-daily-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 180     # 抓取约 20 分钟 + 分卷建大图（100 万行数据池 + 900+ 图表）较重，留足余量

    # ⚠️ 必须有 PYTHONUNBUFFERED：GitHub 把 stdout 当管道，Python 默认**块缓冲**（攒满 8KB 才输出）。
    # fast_crawl 每 10 味药才打一行、一行才 ~200 字节 → 要跑十几分钟才吐第一批日志，
    # 页面看起来像"卡住不动、什么信息都没有"。设为 1 后逐行实时输出。
    env:
      PYTHONUNBUFFERED: '1'

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      # 检查 secrets 里有没有配 GSHEET_SA_B64（还原 Google 服务账号密钥要用）。
      # 配了 → 正常推送 Google Sheet；没配 → 自动跳过 Google 相关步骤，只抓数据，任务仍为绿色。
      # 两个注意点：
      #   1) secrets 不能直接写在 if: 条件里（私有仓库拿不到值），只能先落到 step outputs；
      #   2) secrets 通过 env: 传入，不要直接 ${{ secrets.X }} 内联进脚本，避免值被拼进脚本文本。
      - name: 检查是否配置了 GSHEET_SA_B64
        id: sa
        continue-on-error: true
        env:
          GSHEET_SA_B64: ${{ secrets.GSHEET_SA_B64 }}
        run: |
          if [ -n "$GSHEET_SA_B64" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "已配置 GSHEET_SA_B64，本次会推送 Google Sheet"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::本仓库 secrets 里没有 GSHEET_SA_B64，本次只抓数据、不推送 Google Sheet。"
          fi

      # 表格 ID 已经不再写进代码（仓库公开），CI 必须配 Secret SHEET_ID。
      # 不配就直接红，别等到最后一步才发现表格没更新。
      - name: 校验表格 ID 已配置
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: |
          if [ -z "$SHEET_ID" ]; then
            echo "::error::缺少 Secret SHEET_ID。去 Settings → Secrets and variables → Actions → New repository secret，名称 SHEET_ID，值填表格 ID（浏览器地址栏 /spreadsheets/d/<这串>/edit 中间那串）"
            exit 1
          fi
          echo "已配置 SHEET_ID"

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      # 容错设计：Secret 里贴「base64 串」或「JSON 原文」都能用，并自动清掉 Windows
      # 复制带进来的 \r（用 Out-File 存的文件是 CRLF，粘进来会让 base64 -d 报 invalid input）。
      # 解出来后立刻用 python 校验内容，避免"文件写出来了但不对"要到很后面才炸。
      - name: 还原 Google 服务账号密钥
        if: steps.sa.outputs.ok == 'true'
        env:
          GSHEET_SA_B64: ${{ secrets.GSHEET_SA_B64 }}
        run: |
          RAW="$GSHEET_SA_B64"
          STRIP=$(printf '%s' "$RAW" | tr -d '[:space:]')
          if [ -z "$STRIP" ]; then
            echo "::error::Secret GSHEET_SA_B64 是空的，请重新粘贴"
            exit 1
          fi
          if [ "${STRIP:0:1}" = "{" ]; then
            echo "Secret 里是 JSON 原文，直接写入 service_account.json"
            printf '%s' "$RAW" > service_account.json
          else
            echo "按 base64 解码（长度 ${#STRIP}，已自动去掉换行/空格/回车）"
            if ! printf '%s' "$STRIP" | base64 -d > service_account.json 2>/dev/null; then
              echo "::error::GSHEET_SA_B64 既不是 JSON 也不是合法 base64"
              echo "  长度 = ${#STRIP}"
              echo "  开头 = ${STRIP:0:16}"
              echo "  结尾 = ${STRIP: -16}"
              echo "  合法值只由 A-Z a-z 0-9 + / = 组成；若出现 { \" -----BEGIN 或中文，说明粘错了内容。"
              exit 1
            fi
          fi
          python -c "import json;d=json.load(open('service_account.json',encoding='utf-8'));assert d.get('type')=='service_account','不是 service_account 类型';assert 'private_key' in d,'缺 private_key';print('密钥校验通过:',d.get('client_email'),'| key_id =',d.get('private_key_id'))"

      # 抓取药材涨落数据，并推送到 Google Sheet 的 medicine_data（没配密钥时只抓不推）
      - name: 抓取数据并推送
        env:
          SERVICE_ACCOUNT_FILE: ${{ github.workspace }}/service_account.json
          # 想隐藏表格 ID（比如仓库要公开）时，在仓库 Settings → Secrets 里加一个 SHEET_ID，
          # 这里就能覆盖代码里的默认值；没配就是空串，代码自动回退到默认值，不影响运行。
          SHEET_ID: ${{ secrets.SHEET_ID }}
          TZ: Asia/Shanghai
        run: |
          if [ "${{ steps.sa.outputs.ok }}" = "true" ]; then
            python fast_crawl.py --alias
          else
            python fast_crawl.py --alias --no-push
          fi

      # 抓历史日价格（接口一次返回全部，很快）
      - name: 抓取历史价格日数据
        env:
          TZ: Asia/Shanghai
        run: python history_crawl.py --incremental

      # 「分卷」模式：每卷一张表、每卷 50 个药材，每块 = 官网样式大折线图 + 年×月表。
      # 药材 → 约 32 张卷表（Google 单工作簿上限 200 张），
      # 逐日原始数据集中放 daily_pool（自动隐藏），卷表只放区块，图表跨表引用。
      # 链接 = #gid=<卷表>&range=A<块首行>，跳过去并滚到该药材那一块。
      # 每次运行先删旧的「历史图*」+ 池表 + history_daily/history_index/history_monthly 再重建，
      # 所以是覆盖式更新，不会残留昨天的图。
      # --jobs 6：并发建卷。建图是纯网络等待，1591 个图串行要十几分钟，并发能快好几倍。
      # 配额说明（官方）：写请求 300/分钟/项目，但「每用户」只有 60/分钟；服务账号算一个用户。
      #   所以脚本内置全局限速 GS_RATE_PER_SEC=0.75（≈45/分钟，留 25% 余量）+ 429 后等满 70s 再重试。
      #   「一个 batch 请求只算 1 次配额」，故 CHART_BATCH 调大到 100（1591 图只要 16 次请求）。
      #   官方明确：不超每分钟配额就没有每日总量上限 —— 不会被封，超了只是返回 429 等一分钟。
      - name: 建药材历史价格大图（分卷，覆盖更新）
        if: steps.sa.outputs.ok == 'true'
        env:
          SERVICE_ACCOUNT_FILE: ${{ github.workspace }}/service_account.json
          SHEET_ID: ${{ secrets.SHEET_ID }}
          TZ: Asia/Shanghai
          GS_RATE_PER_SEC: '0.75'
          CHART_BATCH: '100'
        run: python build_herb_sheets.py --per-sheet 50 --drop-monthly --jobs 6

      - name: 结果自检
        run: |
          lines=$(wc -l < 药材涨落对比结果.csv)
          echo "CSV 行数（含表头）：$lines"
          if [ "$lines" -lt 100 ]; then
            echo "::error::结果异常少（$lines 行），大概率被站点拦截了"
            exit 1
          fi

      # 抓取脚本在推送失败时只打一行日志、不会让任务失败。
      # 没有这一步，推送失败时任务照样显示绿色，表格不更新你也不会收到通知。
      - name: 校验 Google Sheet 推送结果
        if: steps.sa.outputs.ok == 'true'
        run: |
          if grep -q "推送成功" crawl.log; then
            echo "Google Sheet 推送成功"
          else
            echo "::error::Google Sheet 推送失败，请看下方日志尾部"
            tail -n 20 crawl.log
            exit 1
          fi

      - name: 保存结果文件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 药材数据-${{ github.run_number }}
          retention-days: 30
          path: |
            药材涨落对比结果.csv
            crawl.log
            failed_medicines.txt
